<!DOCTYPE html>
<html>
<head>
    <title>Different Types of Frames</title>
</head>

<body>

    <h1 align="center">Different Types of Frames</h1>

    <h2>1. Navigation Frame</h2>

    <a href="https://www.google.com" target="myframe">Google</a> |
    <a href="https://www.wikipedia.org" target="myframe">Wikipedia</a> |
    <a href="https://www.w3schools.com" target="myframe">W3Schools</a>

    <br><br>

    <iframe name="myframe" width="600" height="200"
            src="https://www.example.com">
    </iframe>

    <hr>


    <h2>2. Floating Frame</h2>

    <p>This is a floating frame:</p>

    <iframe src="https://www.example.com"
            width="500" height="200">
    </iframe>

    <hr>


    <h2>3. Mixed Frame</h2>

    <iframe src="https://www.example.com"
            width="300" height="150">
    </iframe>

    <iframe src="https://www.w3schools.com"
            width="300" height="150">
    </iframe>

</body>
</html>
