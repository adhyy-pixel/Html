
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body bgcolor="powderblue">

<h1><i><center>String and Maths Function</center></i></h1>

<script>
    var a = "hello";
    var b = "2";
    var c = "have a nice day";

    document.write("string1 = " + a + "<br>");
    document.write("string2 = " + b + "<br>");
    document.write("string3 = " + c + "<br>");

    document.write("<h2>String</h2>");

    document.write("Concatenation = " + a + b + c + "<br>");
    document.write("Length of c = " + c.length + "<br>");
    document.write("Uppercase = " + a.toUpperCase() + "<br>");
    document.write("Lowercase = " + a.toLowerCase() + "<br>");
</script>

</body>
</html>
